name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_REPOSITORY: yyds-love/HuiMen-Terminal-Updates

jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check release identity and versions
        run: node scripts/check-release.mjs
      - name: Require updater signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "Configure TAURI_SIGNING_PRIVATE_KEY before releasing."
            exit 1
          fi
      - name: Require updater repository token
        env:
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          if [ -z "$UPDATE_REPO_TOKEN" ]; then
            echo "Configure UPDATE_REPO_TOKEN with contents:write access to $UPDATE_REPOSITORY."
            exit 1
          fi
      - name: Verify the updater repository is public and initialized
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          repository_info="$(gh api "repos/$UPDATE_REPOSITORY" --jq '[.private, .default_branch] | @tsv')"
          read -r is_private default_branch <<< "$repository_info"
          if [ "$is_private" != "false" ]; then
            echo "$UPDATE_REPOSITORY must be public for application updates."
            exit 1
          fi
          if [ "$default_branch" != "main" ]; then
            echo "$UPDATE_REPOSITORY must have an initialized main branch."
            exit 1
          fi
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify frontend and release tooling
        run: |
          pnpm check-types
          pnpm test
          pnpm test:release

  publish-tauri:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: --bundles nsis,msi
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native services
        run: cargo test --locked

      - name: Read release notes from changelog
        id: release_notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $changelog = Get-Content -Raw CHANGELOG.md
          $pattern = "(?s)## \[$([regex]::Escape($version))\][^\r\n]*(?:\r?\n)(.*?)(?=\r?\n## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if ($match.Success) {
            $body = $match.Groups[1].Value.Trim()
          } else {
            $body = "Multi-platform release for Windows, macOS, and Linux. Auto-update is built in."
          }
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "XuYa Terminal ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} -- --locked

  publish-updates:
    needs: publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download signed release assets from the private source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Point the updater manifest at public release assets
        run: >-
          node scripts/rewrite-updater-manifest.mjs
          release-assets/latest.json
          "$GITHUB_REPOSITORY"
          "$UPDATE_REPOSITORY"
          "${GITHUB_REF_NAME#v}"

      - name: Publish the signed update channel
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"

          if gh release view "$tag" --repo "$UPDATE_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "$UPDATE_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Release $tag is already published in $UPDATE_REPOSITORY."
              exit 0
            fi
          else
            gh release create "$tag" \
              --repo "$UPDATE_REPOSITORY" \
              --target main \
              --draft \
              --title "XuYa Terminal $tag" \
              --notes "Signed updater assets for XuYa Terminal $version."
          fi

          gh release upload "$tag" release-assets/* \
            --repo "$UPDATE_REPOSITORY" \
            --clobber
          gh release edit "$tag" --repo "$UPDATE_REPOSITORY" --draft=false
